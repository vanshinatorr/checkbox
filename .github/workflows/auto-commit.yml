name: Daily Auto Commit

on:
  schedule:
    # Runs every 8 hours (00:00, 08:00, 16:00 UTC) which corresponds to
    # 5:30 AM, 1:30 PM, and 9:30 PM IST.
    # Running multiple times ensures your contribution is guaranteed even if GitHub Actions has delays.
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Heartbeat File
        run: |
          echo "Last heartbeat: $(date)" > heartbeat.txt

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add heartbeat.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily heartbeat [skip ci]" && git push)
